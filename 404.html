<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена — План жизни</title>
<meta name="theme-color" content="#FAF9F6">
<meta name="robots" content="noindex">
<link rel="icon" href="/icons/icon-64.png">
<link rel="manifest" href="/manifest.webmanifest">
<style>
:root{--paper:#FAF9F6;--surface:#FFFFFF;--ink:#16150F;--ink2:#3D3A31;--muted:#6F6B5D;--hair:#E7E3D9;--hair2:#F0EDE6;--accent:#9A7B4F;--accent-deep:#7D6238;color-scheme:light}
[data-theme="dark"]{--paper:#14130F;--surface:#1B1A15;--ink:#EDE9E0;--ink2:#CFC9BC;--muted:#9E988A;--hair:#2E2C25;--hair2:#262420;--accent:#C9A876;--accent-deep:#DCBE93;color-scheme:dark}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#14130F;--surface:#1B1A15;--ink:#EDE9E0;--ink2:#CFC9BC;--muted:#9E988A;--hair:#2E2C25;--hair2:#262420;--accent:#C9A876;--accent-deep:#DCBE93;color-scheme:dark}
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font:400 15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  letter-spacing:-0.003em;min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:32px;
}
.wrap{max-width:620px;width:100%}
.eyebrow{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent-deep);margin:0 0 24px}
h1{font-size:clamp(34px,7vw,56px);font-weight:250;line-height:1.06;letter-spacing:-0.035em;margin:0 0 22px}
.rule{height:1.5pt;background:var(--accent);width:56pt;margin:0 0 28px}
p{color:var(--muted);font-size:17px;line-height:1.65;margin:0 0 18px}
nav{margin-top:38px;padding-top:26px;border-top:1px solid var(--hair)}
nav a{
  display:flex;justify-content:space-between;align-items:center;gap:16px;
  padding:14px 0;border-bottom:1px solid var(--hair);
  color:var(--ink);font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;
  text-decoration:none;transition:color .2s;
}
nav a::after{content:"→";color:var(--accent);font-size:14px}
nav a:hover{color:var(--accent-deep)}
.tools{display:flex;gap:8px;justify-content:flex-end;margin-top:32px}
.sw{
  border:1px solid var(--hair);background:var(--surface);color:var(--muted);
  border-radius:999px;height:30px;padding:0 14px;cursor:pointer;font:inherit;
  font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
}
.sw:hover{border-color:var(--accent);color:var(--ink)}
</style>
<script>
(function(){
  try{var s=localStorage.getItem('planlife-theme');if(s)document.documentElement.setAttribute('data-theme',s);}catch(e){}
})();
</script>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Ошибка 404</p>
  <h1>Такой страницы нет</h1>
  <div class="rule"></div>
  <p>Возможно, ссылка устарела или в адресе опечатка. Вот куда можно пойти:</p>
  <nav>
      <a href="index.html">Главная</a>
      <a href="Конструктор_плана_жизни.html">Конструктор</a>
      <a href="habitgrid.html">HabitGrid</a>
      <a href="База_знаний.html">База знаний</a>
      <a href="Приложения.html">Приложения</a>
      <a href="Бот.html">Бот</a>
      <a href="О_проекте.html">О проекте</a>
  </nav>
  <div class="tools">
    <button class="sw" onclick="(function(){var r=document.documentElement;var c=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');var n=c==='dark'?'light':'dark';r.setAttribute('data-theme',n);try{localStorage.setItem('planlife-theme',n)}catch(e){}})()">Тема</button>
  </div>
</div>
</body>
</html>
